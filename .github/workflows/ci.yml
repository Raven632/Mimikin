name: Node.js CI

on:
  push:
    branches: [ "main" ] # Запускает пайплайн при прямом пуше
  pull_request:
    branches: [ "main" ] # Проверяет код ДО слияния чужих веток

jobs:
  build-and-test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
    - name: Скачивание кода
      uses: actions/checkout@v4

    - name: Настройка Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: api/package-lock.json

    - name: Установка пакетов (Strict Mode)
      working-directory: ./api
      # CUDA для onnxruntime-node (≈300 МБ) тестам не нужна — распознавание в них подменяется
      env:
        ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      run: npm ci

    # ffmpeg и ffprobe — как в образе (Dockerfile): тесты галереи режут им настоящие ролики и анимации
    - name: Установка ffmpeg
      run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

    - name: Запуск тестов
      working-directory: ./api
      env:
        REDIS_URL: redis://localhost:6379
      # Упавший прогон повторяем один раз: тесты ходят по настоящим сокетам, диску и таймерам, и на
      # двух ядрах раннера редкий сбой случается. Но сбой не прячем: предупреждение и строка в сводке
      # называют тесты, упавшие в первый раз. Второй сбой — задание красное
      shell: bash
      run: |
        nproc
        if ! npm test 2>&1 | tee /tmp/api-first.log; then
          failed=$(grep -E '^\s*(✖|not ok)' /tmp/api-first.log | sort -u | head -30) || true  # упал до первого теста — строк «✖» нет, а повтор всё равно нужен
          echo "::warning::Тесты API прошли только со второго раза. Упали в первый: $(echo "$failed" | head -5 | tr '\n' ';')"
          {
            echo "### Тесты API: первый прогон упал, второй прошёл"
            echo '```'
            echo "$failed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm test
        fi

  # Скрипт выкладки (deploy/pull-deploy.sh): его сбой виден только на сервере
  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Скачивание кода
      uses: actions/checkout@v4

    - name: Запуск проверки
      run: tests/deploy/test.sh

  # Служба распознавания текста на картинках (ocr/): разбор картинки на синтетических «надписях», без моделей
  ocr-tests:
    name: OCR service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Скачивание кода
      uses: actions/checkout@v4

    - name: Настройка Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Установка пакетов (те же версии, что в образе службы)
      run: pip install numpy==2.5.3 pillow==12.3.0 opencv-python-headless==5.0.0.93

    - name: Запуск тестов
      working-directory: ./ocr
      run: python -m unittest -v test_pipeline

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Скачивание кода
      uses: actions/checkout@v4

    - name: Настройка Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Установка пакетов (Strict Mode)
      working-directory: ./frontend
      run: npm ci

    # Линтер — до сборки: замечаний ноль, и новые не копятся (правила React — те же, что в редакторе)
    - name: Линтер
      working-directory: ./frontend
      run: npm run lint

    - name: Сборка фронтенда
      working-directory: ./frontend
      run: npm run build

  # Автотесты интерфейса: образ библиотеки из этого коммита, демо-библиотека из выдуманных игр и
  # Playwright — всё в контейнерах, в сети без интернета (tests/e2e/run.sh). Упали — отчёт с трассами
  # и журнал сервера лежат в артефакте e2e-report
  e2e:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Скачивание кода
      uses: actions/checkout@v4

    - name: Автотесты интерфейса
      run: tests/e2e/run.sh
      env:
        CI: 'true'

    - name: Отчёт Playwright
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-report
        path: tests/e2e/report
        retention-days: 7

  # Демо для сайта (pages.yml): запись данных, сборка, проверки и обход страницы в браузере без сети. Ломается — видно уже
  # в pull request, а не после слияния. В needs у mark-deployable его нет: сбой демо не задерживает выкладку тем, кто
  # ставит библиотеку к себе
  demo:
    name: Demo site
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Скачивание кода
      uses: actions/checkout@v4

    - name: Настройка Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: |
          api/package-lock.json
          frontend/package-lock.json
          tests/demo/package-lock.json

    - name: Установка пакетов интерфейса
      working-directory: ./frontend
      run: npm ci

    - name: Установка пакетов сервера
      working-directory: ./api
      env:
        ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      run: npm ci

    - name: Установка ffmpeg
      run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

    # Модели поиска картинок по словам (≈360 МБ) качает tests/demo/models.sh с проверкой sha256; адреса прибиты к ревизиям
    # в самом скрипте, поэтому ключ — его хэш: поменялась ревизия — кэш новый. Запись данных идёт без сети
    - name: Кэш моделей поиска картинок
      id: models-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/demo-cache/models
        key: demo-models-${{ hashFiles('tests/demo/models.sh') }}

    # Запускается всегда: при совпадении сумм sha256 скрипт ничего не качает, а испорченный или обрезанный файл кэша
    # скачивает заново — запись не получит молча другие модели
    - name: Модели поиска картинок
      env:
        DEMO_CACHE: ${{ runner.temp }}/demo-cache
      run: timeout 1800 tests/demo/models.sh

    # Пути — как в контейнере образа, чтобы данные вышли теми же байтами, что у tests/demo/record.sh (подробнее — в pages.yml).
    # DEMO_STRICT: предупреждение записи здесь — ошибка, в pages.yml оно только в журнале
    - name: Запись данных демо
      env:
        TZ: UTC
      run: |
        sudo ln -s "$GITHUB_WORKSPACE" /app
        sudo ln -s "$GITHUB_WORKSPACE/frontend/demo" /frontend-demo
        sudo mkdir /games && sudo chown "$(id -u):$(id -g)" /games
        DEMO_MODELS="$RUNNER_TEMP/demo-cache/models" DEMO_OUT="$GITHUB_WORKSPACE/frontend/demo-data" DEMO_STRICT=1 timeout 1500 node tests/demo/record.js

    - name: Сборка демо
      working-directory: ./frontend
      run: npm run build:demo

    # Обычная сборка не несёт от демо ни байта: ни хука, ни пустышки сокета, ни полосы демо
    - name: Обычная сборка без демо
      working-directory: ./frontend
      run: |
        npm run build
        if grep -rlE 'mimikinDemo|demo-off|fakeSocket' dist; then echo "::error::В обычной сборке остался код демо"; exit 1; fi

    # Каждый адрес /api/ в коде интерфейса должен быть записан или обработан в демо; новый без ответа — ошибка с файлом и строкой
    - name: Покрытие адресов
      run: node tests/demo/coverage.mjs

    # Настоящий сервер и ответ демо на одни и те же запросы: форма ответа не должна разойтись
    - name: Сверка ответов с настоящим сервером
      working-directory: ./api
      env:
        ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      run: node --test --test-force-exit ../tests/demo/contract.test.mjs

    # Таблица ответов демо без браузера: маршруты, обработчики, ключи и сдвиг времени
    - name: Проверки таблицы демо
      run: node --test --test-force-exit tests/demo/router.test.mjs tests/demo/handlers.test.mjs tests/demo/record-guard.test.mjs

    # Свои пакеты Playwright у tests/demo: тест импортирует @playwright/test из своей папки
    - name: Установка Playwright
      working-directory: ./tests/demo
      run: npm ci && npx playwright install --with-deps chromium webkit

    # Обход собранного демо на настольном размере и на телефоне, в Chromium и WebKit: упадёт на любом запросе /api/ или
    # /socket.io/, дошедшем до сети, на ошибке в консоли и на «[demo] unhandled»
    - name: Обход демо
      working-directory: ./tests/demo
      env:
        CI: 'true'
      run: npx playwright test

    - name: Отчёт Playwright
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: demo-report
        path: tests/demo/report
        retention-days: 7
        if-no-files-found: ignore

  # Тесты и сборка прошли — ветка deploy переезжает на этот коммит. Сервер забирает именно её
  # (deploy/pull-deploy.sh): так ему не нужно спрашивать у API GitHub, зелёный ли CI, — у приватного
  # репозитория этот вопрос без токена не задать. Более старый коммит, чей CI закончился позже,
  # ветку назад не двигает
  mark-deployable:
    name: Mark for deploy
    needs: [ build-and-test, ocr-tests, build-frontend, deploy-scripts, e2e ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
    - name: Скачивание кода
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Сравниваем с тем, что на GitHub сейчас (FETCH_HEAD), а не с веткой на момент скачивания кода. Отказ при
    # отправке, когда deploy уже на более новом коммите, — не ошибка: другой запуск успел первым. Красным — только
    # если deploy ушла в сторону от main
    - name: Ветка deploy — на этот коммит
      run: |
        newer() { git fetch -q origin deploy 2>/dev/null && git merge-base --is-ancestor HEAD FETCH_HEAD; }
        if newer; then
          echo "deploy уже на этом коммите или новее"
        elif ! git push origin HEAD:refs/heads/deploy; then
          if newer; then
            echo "deploy уже на более новом коммите"
          else
            echo "::error::В ветке deploy есть коммит, которого нет в main. Верните её на коммит из main"
            exit 1
          fi
        fi
